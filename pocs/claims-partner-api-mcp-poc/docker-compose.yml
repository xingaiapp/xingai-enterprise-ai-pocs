services:
  mock-api:
    build: ./mock-api
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp-server:
    build: ./mcp-server
    ports:
      - "3000:3000"
    environment:
      CLAIMS_API_BASE_URL: http://mock-api:4000
      CLAIMS_API_TOKEN: mock-dev-token
      TRANSPORT: http
      PORT: 3000
    depends_on:
      mock-api:
        condition: service_healthy
