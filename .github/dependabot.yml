version: 2
updates:
  - package-ecosystem: pip
    directory: /pocs/multi-agent-lab/backend
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    labels:
      - chore
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - chore
      - ci
