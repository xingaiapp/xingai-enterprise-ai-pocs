name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pocs/multi-agent-lab/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Test + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pocs/multi-agent-lab/backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements-dev.txt

      # No real API keys — tests run in demo/fallback mode
      - run: pytest
        env:
          OPENAI_API_KEY: ''
          APP_ENV: test
          DATABASE_URL: 'sqlite:///:memory:'

  security:
    name: Security scan (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pocs/multi-agent-lab/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
